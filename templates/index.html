<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Assistant</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <h1>Study Assistant</h1>
            <p>AI-powered learning companion</p>
        </div>

        <div class="status">
            <span></span> Online
        </div>
    </header>


    <main class="chat-container">

        <div id="chat-box" class="chat-box">

            <div class="message bot-message">
                <div class="avatar">AI</div>

                <div class="message-content">
                    <div class="name">Study Assistant</div>

                    <div class="bubble">
                        Hello! 👋<br><br>
                        I can help you with AI, Machine Learning,
                        Data Science, Python, NLP, Cybersecurity
                        and study preparation.
                        <br><br>
                        What would you like to learn?
                    </div>
                </div>
            </div>

        </div>


        <div class="suggestions">

            <button onclick="sendSuggestion('What is machine learning?')">
                What is Machine Learning?
            </button>

            <button onclick="sendSuggestion('What is Python?')">
                What is Python?
            </button>

            <button onclick="sendSuggestion('Give me study tips')">
                Study Tips
            </button>

            <button onclick="sendSuggestion('Give me a quiz')">
                Quiz
            </button>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="message-input"
                placeholder="Ask a study question..."
                autocomplete="off"
            >

            <button id="send-button" onclick="sendMessage()">
                Send
            </button>

        </div>

    </main>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
